# Conda environment for the Epitope Filter Engine server itself.
#
#   conda env create -f environment.yml      # creates "epitope-engine"
#   conda activate epitope-engine
#   bash start.sh
#
# start.sh finds this environment by name even when it is not active, so
# activating it is optional.
#
# This environment runs only the Flask server: it never imports torch or
# TensorFlow. Each predictor gets its own environment (see INSTALL.md).
name: epitope-engine
channels:
  - conda-forge
dependencies:
  - python=3.11
  - flask>=3.0
  - pandas>=2.0
