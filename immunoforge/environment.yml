# Conda environment for the Immunoforge server itself.
#
#   conda env create -f environment.yml      # creates "epitope-engine"
#   conda activate epitope-engine
#   bash start.sh
#
# start.sh finds this environment by name even when it is not active, so
# activating it is optional.
#
# This environment runs only the Flask server: it never imports torch or
# TensorFlow. Each predictor gets its own environment (see INSTALL.md).
name: immunoforge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - flask>=3.0
  - pandas>=2.0
  # The Simulation module runs in this interpreter, so its dependencies are
  # here too. matplotlib is not needed: only the command-line figure scripts
  # use it, and the GUI draws its charts in the browser.
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
