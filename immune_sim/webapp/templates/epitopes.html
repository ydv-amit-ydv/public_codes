{% extends "base.html" %}
{% block title %}Epitopes &middot; immune_sim{% endblock %}
{% block body %}
<div class="layout">
  <aside class="panel">
    <h2>Antigen</h2>
    <label>UniProt accession
      <input type="text" id="acc" placeholder="P0DTC2"></label>
    <button id="fetch" class="ghost">Fetch sequence</button>

    <label>Or paste a protein sequence / FASTA
      <textarea id="sequence" rows="9" placeholder="MFVFLVLLPLVSSQCVN..."></textarea></label>
    <label>Name <input type="text" id="name" placeholder="spike"></label>
    <div class="hint" id="seqinfo"></div>

    <button id="run" class="primary">Predict epitopes</button>
    <div id="status" class="status"></div>

    <p class="hint">Class I ROC-AUC on an <em>unseen pathogen</em> is
      <strong>0.769</strong>, not the 0.916 a random split gives. Class II
      generalises poorly — see <a href="/validation">Validation</a>.</p>
  </aside>

  <section class="content">
    <div id="summary" class="cards"></div>
    <div class="chart" id="c-map"></div>
    <div id="table"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script>initEpitopes();</script>{% endblock %}
